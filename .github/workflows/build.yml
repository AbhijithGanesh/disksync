name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v5
        with:
          name: disksync
          path: target/release/disksync.exe
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create ${{ github.ref_name }} target/release/disksync.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
