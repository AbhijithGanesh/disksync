name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: target/release/windowsyncutility.exe

  # Static binary for running from a Linux live USB (no glibc version issues).
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable && rustup target add x86_64-unknown-linux-musl
      - run: cargo test --release
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: mv target/x86_64-unknown-linux-musl/release/windowsyncutility windowsyncutility-linux-x86_64
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: windowsyncutility-linux-x86_64

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
      - run: gh release create ${{ github.ref_name }} windows/windowsyncutility.exe linux/windowsyncutility-linux-x86_64 --generate-notes -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
